name: deriv-robot
# Робот Deriv: ДЕМО-сделки Rise/Fall по схемам модели Pocket Option (trader/deriv/robot.py).
# Один запуск работает ~5ч45м и перезапускает сам себя; в субботу останавливается.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "loop | test_trade | dry"
        default: loop
permissions:
  contents: write
  actions: write
concurrency:
  group: deriv-robot-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas==2.2.3 numpy==2.1.3 websockets==13.1
      - name: robot
        id: robot
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
        run: |
          git config user.name "deriv-robot"
          git config user.email "deriv-robot@users.noreply.github.com"
          cd trader && python deriv/robot.py "${{ inputs.mode }}"
      - name: continue chain
        if: ${{ inputs.mode == 'loop' && steps.robot.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deriv-robot.yml --ref "${GITHUB_REF_NAME}" -f mode=loop
